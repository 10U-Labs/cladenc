---
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  assert-coverage:
    needs:
      - e2e-test-coverage
      - integration-test-coverage
      - unit-test-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "assert-coverage placeholder"
  assert-no-comments:
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "assert-no-comments placeholder"
  assert-no-empty-test-files:
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "assert-no-empty-test-files placeholder"
  assert-no-inline-directives:
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "assert-no-inline-directives placeholder"
  assert-no-linter-config-files:
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "assert-no-linter-config-files placeholder"
  assert-no-oversized-sources-files:
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "assert-no-oversized-sources-files placeholder"
  assert-one-assert-per-test:
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "assert-one-assert-per-test placeholder"
  build-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "build-coverage placeholder"
  build-debug:
    needs:
      - assert-coverage
      - assert-no-comments
      - assert-no-empty-test-files
      - assert-no-inline-directives
      - assert-no-linter-config-files
      - assert-no-oversized-sources-files
      - assert-one-assert-per-test
      - rustfmt
      - yamllint
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "build-debug placeholder"
  build-release:
    needs:
      - e2e-test-debug
      - integration-test-debug
      - unit-test-debug
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "build-release placeholder"
  e2e-test-coverage:
    needs: build-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "e2e-test-coverage placeholder"
  e2e-test-debug:
    needs: build-debug
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "e2e-test-debug placeholder"
  integration-test-coverage:
    needs: build-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "integration-test-coverage placeholder"
  integration-test-debug:
    needs: build-debug
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "integration-test-debug placeholder"
  package:
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "package placeholder"
  release:
    needs: test-package
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "release placeholder"
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "rustfmt placeholder"
  test-package:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "test-package placeholder"
  unit-test-coverage:
    needs: build-coverage
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "unit-test-coverage placeholder"
  unit-test-debug:
    needs: build-debug
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "unit-test-debug placeholder"
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install yamllint
      - name: yamllint
        run: |
          EMPTY_LINES='empty-lines: {max: 0, max-start: 0, max-end: 1}'
          KEY_ORDERING='key-ordering: enable'
          TRUTHY='truthy: {allowed-values: ["true", "false", "on"]}'
          RULES="$EMPTY_LINES, $KEY_ORDERING, $TRUTHY"
          yamllint --strict --format github \
            --config-data "{extends: default, rules: {$RULES}}" \
            .github/workflows/release.yml
name: release
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - "src/**"
      - "test/**"
